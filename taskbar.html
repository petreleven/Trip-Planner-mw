<!DOCTYPE html>
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>



<body class ="d-flex justify-content-center align-items-center vh-100"id="myBody">
	<div class="my-auto">
<h1>My Task App</h1>	
<input placeholder="Type in anything..." id="myInput"></input>

<button onclick="trigger()">Add</button>
<div id="box"></div>
</div>
   
</body>

<script>
	console.log("Holaaaa")

	let allTasks = []

	function trigger()
	{
		console.log("Triggered!!!")
		let input = document.getElementById("myInput")
		console.log(allTasks)

		let task = input.value

		allTasks.push(task)
		console.log(allTasks)

		let box = document.getElementById("box")
		box.innerText = ""
		for (let num = 0; num < allTasks.length; num+=1)
		{
		box.insertAdjacentHTML("beforeEnd",`

	<div class ="d-flex flex-row mb-3 align-items-center">
	<p class= "p-2"> ${allTasks[num]} </p>
	<button onclick = erase (${num}) > x </button>
	</div>
	`)

		}

	}

	function erase(num)
	{
		allTasks.splice(num,1)
		let box = document.getElementById("box")
		box.innerText = ""
		for (let num = 0; num < allTasks.length; num+=1)
		{
		box.insertAdjacentHTML("beforeEnd",

			`
	<div class ="d-flex flex-row mb-3 align-items-center">
	<p class="p-2"> ${allTasks[num]} </p>
	<button onclick = erase (${num}) > x </button>
	</div>
	`
	)
		}
	}
</script>
</html>
