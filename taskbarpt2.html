<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Task App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Caveat', cursive; }

    body {
      background: linear-gradient(135deg, #ffe4ec 0%, #fce4f3 50%, #f3e4ff 100%);
      min-height: 100vh;
    }

    .app-card {
      background: #fff8fb;
      border: 1.5px solid #f7bdd4;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px rgba(220, 130, 170, 0.13);
      min-width: 380px;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      color: #c2547a;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    h1 .emoji {
      font-size: 2rem;
      margin-right: 6px;
    }

    .input-group .form-control {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      background: #fff0f6;
      border: 1.5px solid #f4aac8;
      border-right: none;
      border-radius: 12px 0 0 12px;
      color: #7a3050;
      padding: 0.55rem 1rem;
    }

    .input-group .form-control::placeholder { color: #e8a0bc; }

    .input-group .form-control:focus {
      background: #fff5f9;
      border-color: #e07aa0;
      box-shadow: 0 0 0 3px rgba(220, 130, 170, 0.18);
    }

    .btn-add {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      font-weight: 600;
      background: #e07aa0;
      border: 1.5px solid #e07aa0;
      border-radius: 0 12px 12px 0;
      color: #fff;
      padding: 0.55rem 1.2rem;
      transition: background 0.18s, border-color 0.18s;
    }

    .btn-add:hover, .btn-add:focus {
      background: #c2547a;
      border-color: #c2547a;
      color: #fff;
    }

    .task-list { margin-top: 1.5rem; }

    .task-item {
      display: flex;
      align-items: center;
      background: #fff0f6;
      border: 1px solid #f7bdd4;
      border-radius: 12px;
      padding: 0.6rem 1rem;
      margin-bottom: 0.7rem;
      transition: background 0.15s;
    }

    .task-item:hover { background: #ffe4ec; }

    .task-text {
      flex: 1;
      color: #7a3050;
      font-size: 1.25rem;
      margin: 0;
    }

    .btn-delete {
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      font-weight: 700;
      background: transparent;
      border: 1.5px solid #f4aac8;
      border-radius: 50%;
      color: #c2547a;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: #f7bdd4;
      border-color: #e07aa0;
      color: #7a3050;
    }

    .empty-note {
      color: #e8a0bc;
      font-size: 1.1rem;
      text-align: center;
      margin-top: 1rem;
      font-style: italic;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">

  <div class="app-card">
    <h1><span class="emoji">🌸</span> My Task App</h1>

    <div class="input-group">
      <input type="text" class="form-control" placeholder="Add a new task..." id="myInput" onkeydown="if(event.key==='Enter') trigger()">
      <button class="btn btn-add" onclick="trigger()">+ Add</button>
    </div>

    <div class="task-list" id="box">
      <p class="empty-note">No tasks yet — add something above!</p>
    </div>
  </div>

  <script>
    let allTasks = [];

    function render() {
      const box = document.getElementById('box');
      box.innerHTML = '';
      if (allTasks.length === 0) {
        box.innerHTML = '<p class="empty-note">No tasks yet — add something above!</p>';
        return;
      }
      allTasks.forEach((task, num) => {
        box.insertAdjacentHTML('beforeend', `
          <div class="task-item">
            <p class="task-text">${task}</p>
            <button class="btn-delete" onclick="erase(${num})" title="Remove task">✕</button>
          </div>
        `);
      });
    }

    function trigger() {
      const input = document.getElementById('myInput');
      const task = input.value.trim();
      if (!task) return;
      allTasks.push(task);
      input.value = '';
      render();
    }

    function erase(num) {
      allTasks.splice(num, 1);
      render();
    }
  </script>
</body>
</html>
